<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Pro — Danh mục Sản phẩm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-slate-900 flex-shrink-0 overflow-y-auto"></aside>
    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header id="header" class="bg-white border-b border-slate-200 px-6 py-4 flex-shrink-0"></header>
      <main class="flex-1 overflow-y-auto p-6">
        
        <!-- Search Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
          <div class="flex gap-2">
            <div class="relative flex-1">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="search" class="w-5 h-5"></i>
              </div>
              <input type="text" id="searchInput" 
                class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Tìm kiếm bình gas, bếp gas, phụ kiện...">
            </div>
            <button id="searchBtn" class="px-6 py-2.5 bg-blue-800 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2">
              Tìm kiếm
            </button>
          </div>
          <div id="searchAlert" class="mt-3 p-3 bg-blue-50 text-blue-800 border border-blue-200 rounded-lg text-sm hidden flex items-start gap-2">
            <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
            <span id="searchAlertText">Không tìm thấy kết quả chính xác. Hiển thị kết quả liên quan (Full-text Search):</span>
          </div>
        </div>

        <!-- Filter Row -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
          <button class="filter-btn active px-4 py-2 bg-blue-800 text-white rounded-full text-sm font-medium whitespace-nowrap" data-filter="all">Tất cả</button>
          <button class="filter-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-sm font-medium whitespace-nowrap hover:bg-slate-50" data-filter="binh-gas">Bình gas</button>
          <button class="filter-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-sm font-medium whitespace-nowrap hover:bg-slate-50" data-filter="bep-gas">Bếp gas</button>
          <button class="filter-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-sm font-medium whitespace-nowrap hover:bg-slate-50" data-filter="phu-kien">Phụ kiện</button>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- Products will be generated by JS -->
        </div>

      </main>
    </div>
  </div>
  <script src="shared.js"></script>
  <script>
    const products = [
      { id: 1, name: 'Bình gas Petrolimex 12kg', brand: 'Petrolimex', price: 420000, rating: 5, category: 'binh-gas', tag: 'PG 12kg' },
      { id: 2, name: 'Bình gas Petrolimex 50kg', brand: 'Petrolimex', price: 1150000, rating: 4, category: 'binh-gas', tag: 'PG 50kg' },
      { id: 3, name: 'Bình gas PV Gas 12kg', brand: 'PV Gas', price: 410000, rating: 5, category: 'binh-gas' },
      { id: 4, name: 'Bình gas Saigon Petro 12kg', brand: 'Saigon Petro', price: 415000, rating: 4, category: 'binh-gas' },
      { id: 5, name: 'Bếp gas Rinnai RV-365', brand: 'Rinnai', price: 2800000, rating: 5, category: 'bep-gas' },
      { id: 6, name: 'Bếp gas Namilux NA-300', brand: 'Namilux', price: 1200000, rating: 4, category: 'bep-gas' },
      { id: 7, name: 'Van gas Namilux', brand: 'Namilux', price: 120000, rating: 4, category: 'phu-kien' },
      { id: 8, name: 'Dây gas Petrolimex 1.5m', brand: 'Petrolimex', price: 85000, rating: 3, category: 'phu-kien' }
    ];

    function renderStars(rating) {
      let html = '';
      for(let i = 1; i <= 5; i++) {
        if(i <= rating) html += '<i data-lucide="star" class="w-4 h-4 fill-orange-400 text-orange-400"></i>';
        else html += '<i data-lucide="star" class="w-4 h-4 text-slate-300"></i>';
      }
      return html;
    }

    function renderProducts(list) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = list.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
          <div class="h-48 bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center relative">
             <i data-lucide="${p.category === 'bep-gas' ? 'flame' : p.category === 'binh-gas' ? 'package' : 'wrench'}" class="w-16 h-16 text-slate-400 opacity-50"></i>
             <div class="absolute top-2 right-2 bg-white/80 backdrop-blur px-2 py-1 rounded text-xs font-medium text-slate-600 border border-slate-200">${p.brand}</div>
          </div>
          <div class="p-4 flex-1 flex flex-col">
            <h3 class="font-medium text-slate-900 mb-1 line-clamp-2">${p.name}</h3>
            <div class="flex items-center gap-1 mb-2">
              ${renderStars(p.rating)}
            </div>
            <div class="mt-auto">
              <div class="text-lg font-bold text-blue-800 mb-3">${typeof fmtMoney === 'function' ? fmtMoney(p.price) : p.price.toLocaleString('vi-VN') + ' đ'}</div>
              <button onclick="addToCart('${p.name}')" class="w-full py-2 bg-blue-50 text-blue-700 rounded-lg font-medium hover:bg-blue-100 transition-colors flex items-center justify-center gap-2">
                <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                Thêm vào giỏ
              </button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function addToCart(name) {
      if(typeof showToast === 'function') {
        showToast('Đã thêm ' + name + ' vào giỏ hàng', 'success');
      } else {
        alert('Đã thêm ' + name + ' vào giỏ hàng');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initPage === 'function') {
        initPage('Danh mục Sản phẩm', [{label: 'Sản phẩm', url: '#'}]);
      } else {
        lucide.createIcons();
      }
      
      renderProducts(products);

      // Filter
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Update active state
          filterBtns.forEach(b => {
            b.classList.remove('bg-blue-800', 'text-white');
            b.classList.add('bg-white', 'text-slate-600');
          });
          btn.classList.remove('bg-white', 'text-slate-600');
          btn.classList.add('bg-blue-800', 'text-white');

          const category = btn.dataset.filter;
          if (category === 'all') {
            renderProducts(products);
          } else {
            renderProducts(products.filter(p => p.category === category));
          }
        });
      });

      // Search
      const searchBtn = document.getElementById('searchBtn');
      const searchInput = document.getElementById('searchInput');
      const searchAlert = document.getElementById('searchAlert');
      const searchAlertText = document.getElementById('searchAlertText');

      searchBtn.addEventListener('click', () => {
        const query = searchInput.value.trim().toLowerCase();
        searchAlert.classList.add('hidden');

        if (query === 'bếp gas ngoại hành tinh') {
          searchAlert.classList.remove('hidden');
          searchAlertText.textContent = 'Không tìm thấy kết quả chính xác. Hiển thị kết quả liên quan (Full-text Search):';
          renderProducts(products.filter(p => p.name.toLowerCase().includes('bếp gas')));
        } 
        else if (query.includes('pg 12kg')) {
          renderProducts(products.filter(p => p.tag === 'PG 12kg'));
        }
        else if (query !== '') {
           renderProducts(products.filter(p => p.name.toLowerCase().includes(query)));
        } else {
           renderProducts(products);
        }
      });
      
      searchInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') searchBtn.click();
      });
    });
  </script>
</body>
</html>
