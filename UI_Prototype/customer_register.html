<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Pro — Đăng ký Tài khoản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-blue-900 min-h-screen flex items-center justify-center p-4">
  
  <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/20 text-blue-400 mb-4">
        <i data-lucide="flame" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">Đăng ký Tài khoản</h1>
      <p class="text-slate-300">Quản lý gas thông minh cùng Gas Pro</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <!-- SĐT -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Số điện thoại</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="phone" class="w-5 h-5"></i>
          </div>
          <input type="tel" id="phoneInput" required
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
            placeholder="Nhập số điện thoại">
        </div>
      </div>

      <!-- Mật khẩu -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-5 h-5"></i>
          </div>
          <input type="password" id="passwordInput" required
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
            placeholder="Nhập mật khẩu (từ 6 ký tự)">
        </div>
        <p id="passwordError" class="text-red-400 text-sm mt-1 hidden">Mật khẩu phải từ 6 ký tự</p>
      </div>

      <!-- Xác nhận mật khẩu -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Xác nhận mật khẩu</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-5 h-5"></i>
          </div>
          <input type="password" id="confirmPasswordInput" required
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
            placeholder="Nhập lại mật khẩu">
        </div>
        <p id="confirmPasswordError" class="text-red-400 text-sm mt-1 hidden">Mật khẩu xác nhận không khớp</p>
      </div>

      <div id="phoneError" class="bg-orange-500/20 border border-orange-500/50 text-orange-200 p-3 rounded-lg text-sm hidden">
        Số điện thoại đã được đăng ký. <a href="index.html" class="font-bold underline hover:text-orange-100">Vui lòng đăng nhập.</a>
      </div>

      <button type="submit" 
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-900 transition-colors mt-6">
        Đăng ký
      </button>

      <div class="text-center mt-4 text-sm text-slate-300">
        Đã có tài khoản? 
        <a href="index.html" class="font-medium text-blue-400 hover:text-blue-300 transition-colors">Đăng nhập</a>
      </div>
    </form>
  </div>
  
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      
      const form = document.getElementById('registerForm');
      const phoneInput = document.getElementById('phoneInput');
      const passwordInput = document.getElementById('passwordInput');
      const confirmPasswordInput = document.getElementById('confirmPasswordInput');
      
      const passwordError = document.getElementById('passwordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');
      const phoneError = document.getElementById('phoneError');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Reset errors
        passwordError.classList.add('hidden');
        confirmPasswordError.classList.add('hidden');
        phoneError.classList.add('hidden');
        
        const phone = phoneInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        let isValid = true;
        
        if (password.length < 6) {
          passwordError.classList.remove('hidden');
          isValid = false;
        }
        
        if (password !== confirmPassword) {
          confirmPasswordError.classList.remove('hidden');
          isValid = false;
        }
        
        if (phone === '0901234567') {
          phoneError.classList.remove('hidden');
          isValid = false;
        }
        
        if (isValid) {
          // If showToast is available from shared.js, else fallback
          if(typeof showToast === 'function') {
             showToast('Đăng ký thành công! Tự động đăng nhập...', 'success');
          } else {
             alert('Đăng ký thành công! Tự động đăng nhập...');
          }
          
          setTimeout(() => {
            window.location.href = 'customer_catalog.html';
          }, 1500);
        }
      });
    });
  </script>
</body>
</html>
